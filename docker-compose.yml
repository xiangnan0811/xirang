services:
  xirang:
    image: linnea7171/xirang:${IMAGE_TAG:-latest}
    container_name: xirang
    # 必须先复制 .env.deploy 为 .env 并填写生产必填项：
    # JWT_SECRET(≥32) / DATA_ENCRYPTION_KEY(≥16) / METRICS_TOKEN(≥16，非占位符)
    # ADMIN_INITIAL_PASSWORD 仅首次启动且库中尚无 admin 时需要。
    # 缺少 .env 时 docker compose config/up 会失败；生产环境禁止依赖空密钥默认值。
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data           # SQLite 数据库及应用数据，务必备份此目录
      - ./backups:/backup      # 自动备份目录（每日 02:00 备份，保留 30 天）
      - ./logs:/logs           # 应用与 Nginx 日志
    ports:
      - "10761:10761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:10761/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
