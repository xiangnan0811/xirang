services:
  xirang:
    image: linnea7171/xirang:${IMAGE_TAG:-latest}
    container_name: xirang
    # 复制 .env.deploy 为 .env 并修改必改项（ADMIN_INITIAL_PASSWORD / JWT_SECRET / DATA_ENCRYPTION_KEY）
    # 若不提供 .env，容器将使用环境默认值启动（生产环境不推荐）
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data           # SQLite 数据库及应用数据，务必备份此目录
      - ./backups:/backup      # 自动备份目录（每日 02:00 备份，保留 30 天）
      - ./logs:/logs           # 应用与 Nginx 日志
    ports:
      - "10761:10761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:10761/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
