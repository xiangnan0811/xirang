name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "部署环境（仅维护者私有环境）"
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "要部署的镜像标签（例如 latest 或 v0.2.0）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Manual Deploy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag }}
      IMAGE_WAIT_MAX_ATTEMPTS: ${{ vars.IMAGE_WAIT_MAX_ATTEMPTS || 90 }}
      IMAGE_WAIT_INTERVAL_SECONDS: ${{ vars.IMAGE_WAIT_INTERVAL_SECONDS || 10 }}
    steps:
      - name: DockerHub login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Wait for image ready
        shell: bash
        run: |
          set -euo pipefail
          image="docker.io/linnea7171/xirang:${IMAGE_TAG}"
          i=1
          while [[ "${i}" -le "${IMAGE_WAIT_MAX_ATTEMPTS}" ]]; do
            if docker manifest inspect "${image}" >/dev/null 2>&1; then
              echo "image ready: ${image}"
              exit 0
            fi

            if [[ "${i}" -eq "${IMAGE_WAIT_MAX_ATTEMPTS}" ]]; then
              echo "image not found after ${IMAGE_WAIT_MAX_ATTEMPTS} attempts: ${image}" >&2
              exit 1
            fi

            sleep "${IMAGE_WAIT_INTERVAL_SECONDS}"
            i=$((i + 1))
          done

      - name: Backup database before upgrade
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            if [ -f backups/db-backup-$(date +%Y%m%d-%H%M%S).sqlite ]; then
              echo "Backup already exists, skipping"
              exit 0
            fi

            mkdir -p backups

            container_id=$(docker inspect xirang --format='{{.Id}}' 2>/dev/null || echo "")
            if [ -n "${container_id}" ] && [ "$(docker inspect xirang --format='{{.State.Running}}' 2>/dev/null)" = "true" ]; then
              timestamp=$(date +%Y%m%d-%H%M%S)
              # Try to copy the database file from the container; fall back to
              # the named volume path if the container path doesn't exist.
              backup_file="backups/db-backup-${timestamp}.sqlite"
              if docker cp xirang:/app/data/xirang.db "${backup_file}" 2>/dev/null; then
                echo "Database backup created: ${backup_file}"
              elif [ -f data/xirang.db ]; then
                cp data/xirang.db "${backup_file}"
                echo "Database backup created (volume path): ${backup_file}"
              else
                echo "Warning: could not locate database file to back up" >&2
              fi
            else
              echo "Container not running, skipping database backup"
            fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose pull
            docker compose up -d

            echo "等待健康检查通过（最多 90s）..."
            n=0
            until [ "$(docker inspect --format='{{.State.Health.Status}}' xirang 2>/dev/null)" = "healthy" ]; do
              n=$((n+1))
              status=$(docker inspect --format='{{.State.Health.Status}}' xirang 2>/dev/null || echo "unknown")
              if [ "$status" = "unhealthy" ] || [ "$n" -ge "18" ]; then
                echo "服务启动失败：healthcheck 状态 = ${status}" >&2
                docker logs xirang --tail=50 >&2
                exit 1
              fi
              echo "  等待健康检查 (${n}/18)，当前状态：${status}..."
              sleep 5
            done
            echo "健康检查通过，部署完成"

            docker compose ps
