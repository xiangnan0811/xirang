name: PR Metadata

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-metadata-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}
      - name: Validate current pull request title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          pr_title="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.title // empty')"
          test -n "$pr_title"
          bash scripts/check-pr-title.sh "$pr_title"
