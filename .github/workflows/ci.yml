name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-pr-title.sh "${PR_TITLE}"

  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Lint backend
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          working-directory: backend
          only-new-issues: true

      - name: Download modules
        run: go mod download

      - name: Run backend tests
        run: go test -coverprofile=coverage.out ./...

      - name: Check backend coverage
        continue-on-error: true
        run: |
          COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Backend coverage: ${COV}%"
          if (( $(echo "$COV < 60" | bc -l) )); then
            echo "::warning ::Backend coverage ${COV}% is below 60% threshold"
          fi

      - name: Build backend
        run: go build ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Check Go vulnerabilities
        continue-on-error: true
        run: govulncheck ./...

      - name: Upload backend coverage
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: backend/coverage.out
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  postgres-migration:
    name: PostgreSQL Migration Parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: xirang_test
          POSTGRES_PASSWORD: FAKE_POSTGRES_PASSWORD_FOR_TEST_ONLY
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xirang_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://postgres:FAKE_POSTGRES_PASSWORD_FOR_TEST_ONLY@127.0.0.1:5432/xirang_test?sslmode=disable
      REQUIRE_POSTGRES_MIGRATION_TEST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run PostgreSQL migration parity
        run: go test ./internal/database -run 'TestBackupAssetMigration062Postgres' -count=1

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check npm vulnerabilities
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Run frontend check
        run: npm run check

      - name: Check frontend bundle budget
        # Requires dist/ produced by 'npm run check' (which includes build)
        run: node scripts/check-bundle-budget.mjs

      - name: Check frontend coverage
        if: always()
        continue-on-error: true
        run: |
          if [ -f coverage/lcov.info ]; then
            LINES=$(grep -c "^SF:" coverage/lcov.info || echo 0)
            COVERED=$(grep -c "^DA:" coverage/lcov.info || echo 0)
            echo "Frontend source files: ${LINES}"
            echo "Frontend covered lines entries: ${COVERED}"
          else
            echo "::warning ::Frontend coverage report not found"
          fi

      - name: Upload frontend coverage
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: web/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Build Docker image
        run: docker build -f deploy/allinone/Dockerfile .

  doc-freshness:
    name: Doc Freshness Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check doc freshness
        run: bash scripts/check-doc-freshness.sh

      - name: Self-test doc freshness script
        run: bash scripts/check-doc-freshness.test.sh

  migration-utc-safety:
    name: Migration UTC Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Lint migrations for UTC regression patterns
        run: bash scripts/check-migration-utc-safety.sh

      - name: Self-test the lint script
        run: bash scripts/check-migration-utc-safety.test.sh
