name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.number || github.ref }}-${{ github.event.action == 'edited' && github.run_id || 'source' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: CI Event Classification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.event.outputs.mode }}
      reason: ${{ steps.event.outputs.reason }}
      record: ${{ steps.event.outputs.record }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Classify CI event
        id: event
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 scripts/classify-ci-event.py --record "$RUNNER_TEMP/ci-event-record/record.json"
      - name: Upload CI event record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-event-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-event-record/record.json
          if-no-files-found: error

  backend:
    name: Backend Test & Build
    needs: [classify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Checkout metadata verifier
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.mode == 'metadata' }}
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/classify-ci-event.py
      - name: Verify source check
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.mode == 'metadata' }}
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_METADATA_RECORD: ${{ needs.classify.outputs.record }}
        run: python3 scripts/classify-ci-event.py --source-check 'Backend Test & Build'

      - name: Setup Go
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install recovery integration tools
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-server

      - name: Verify local lint toolchain launcher
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: bash ../scripts/lint-backend.test.sh

      - name: Lint backend
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall
          working-directory: backend
          # Full-repository lint avoids GitHub's 20,000-line PR patch limit for
          # large checkpoint deliveries while preserving the stricter local gate.
          only-new-issues: false

      - name: Download modules
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: go mod download

      - name: Run backend tests
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: |
          rm -f -- coverage.out
          go test -count=1 -coverprofile=coverage.out ./...
          test ! -L "$GITHUB_WORKSPACE/.tmp"
          test ! -L "$GITHUB_WORKSPACE/.tmp/agent"
          mkdir -p "$GITHUB_WORKSPACE/.tmp/agent"
          PROOF_WORK="$(mktemp -d "$GITHUB_WORKSPACE/.tmp/agent/ci-evidence.XXXXXXXX")"
          trap 'rm -rf -- "$PROOF_WORK"' EXIT
          TMPDIR="$PROOF_WORK" go build -o "$PROOF_WORK/verify-ci-profile" ./cmd/verify-ci-profile
          TMPDIR="$PROOF_WORK" python3 -B ../scripts/ci-evidence.test.py --profile-verifier "$PROOF_WORK/verify-ci-profile"

      - name: Race concurrency-sensitive backend packages
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: go test -race -timeout=20m ./internal/sshutil ./internal/backupasset/... ./internal/api/handlers/ ./internal/task ./internal/task/executor ./internal/task/verifier ./internal/ws ./internal/auth ./internal/bootstrap ./internal/policy ./internal/automation ./internal/alerting ./internal/escalation -count=1

      - name: Backup-asset coverage floor
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: bash ../scripts/check-backupasset-coverage.sh

      - name: Check backend coverage
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: |
          COV=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | sed 's/%//')
          if [ -z "${COV}" ]; then
            echo "::error::Backend coverage report has no total percentage"
            exit 1
          fi
          echo "Backend coverage: ${COV}%"
          if ! awk -v coverage="${COV}" 'BEGIN { exit !(coverage >= 60) }'; then
            echo "::error::Backend coverage ${COV}% is below the enforced 60% threshold"
            exit 1
          fi

      - name: Build backend
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: go build ./...

      - name: Install govulncheck
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Check Go vulnerabilities
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: govulncheck ./...

      - name: Backup-asset load contract
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        working-directory: .
        run: BACKUP_ASSET_LOAD_LOCAL=ci-bounded bash scripts/test-backup-asset-load.sh

  postgres-migration:
    name: ${{ needs.classify.result == 'success' && needs.classify.outputs.mode == 'metadata' && 'Metadata only / PostgreSQL Migration Parity' || 'PostgreSQL Migration Parity' }}
    needs: [classify]
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: xirang_test
          POSTGRES_PASSWORD: FAKE_POSTGRES_PASSWORD_FOR_TEST_ONLY
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xirang_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://postgres:FAKE_POSTGRES_PASSWORD_FOR_TEST_ONLY@127.0.0.1:5432/xirang_test?sslmode=disable
      REQUIRE_POSTGRES_MIGRATION_TEST: "1"
      REQUIRE_POSTGRES_RECOVERY_TEST: "1"
      REQUIRE_POSTGRES_CATALOG_TEST: "1"
      REQUIRE_POSTGRES_SEARCH_TEST: "1"
      REQUIRE_POSTGRES_OVERLAY_TEST: "1"
      REQUIRE_POSTGRES_CONTENT_TEST: "1"
      REQUIRE_POSTGRES_PROCESSING_TEST: "1"
      REQUIRE_POSTGRES_EXPORT_TEST: "1"
      REQUIRE_POSTGRES_GENERAL_TEST: "1"
      REQUIRE_POSTGRES_TASK_TERMINAL_TEST: "1"
      REQUIRE_POSTGRES_ESCALATION_PREVIEW_TEST: "1"
      REQUIRE_POSTGRES_LEASE_TEST: "1"
      REQUIRE_POSTGRES_REPOSITORY_TEST: "1"
      REQUIRE_POSTGRES_PRODUCER_RETENTION_TEST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install recovery integration tools
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-server

      - name: Download modules
        run: go mod download

      - name: Test required PostgreSQL runner protocol
        run: bash ../scripts/run-required-postgres-tests.test.sh

      - name: Run required PostgreSQL inventory
        run: bash ../scripts/run-required-postgres-tests.sh --evidence-dir "${{ runner.temp }}/required-postgres-evidence"

      - name: Upload required PostgreSQL evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: required-postgres-evidence
          path: ${{ runner.temp }}/required-postgres-evidence
          if-no-files-found: error

      - name: Run PostgreSQL backup and restore round-trip
        working-directory: .
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "${POSTGRES_SERVICE_CONTAINER}"
          docker exec "${POSTGRES_SERVICE_CONTAINER}" mkdir -p /tmp/xirang-contract/scripts
          docker cp scripts/. "${POSTGRES_SERVICE_CONTAINER}:/tmp/xirang-contract/scripts"
          docker exec \
            -e TEST_POSTGRES_DSN="${TEST_POSTGRES_DSN}" \
            "${POSTGRES_SERVICE_CONTAINER}" \
            bash /tmp/xirang-contract/scripts/postgres-backup-restore.integration.test.sh

  cron-backup:
    name: ${{ needs.classify.result == 'success' && needs.classify.outputs.mode == 'metadata' && 'Metadata only / Isolated Cron Backup Roundtrip' || 'Isolated Cron Backup Roundtrip' }}
    needs: [classify]
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Test isolated cron cleanup protocol
        run: bash scripts/cron-backup-isolated.test.sh

      - name: Run isolated SQLite and PostgreSQL cron roundtrip
        run: bash scripts/cron-backup-isolated.integration.test.sh

  frontend:
    name: Frontend Test & Build
    needs: [classify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Checkout metadata verifier
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.mode == 'metadata' }}
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/classify-ci-event.py
      - name: Verify source check
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.mode == 'metadata' }}
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_METADATA_RECORD: ${{ needs.classify.outputs.record }}
        run: python3 scripts/classify-ci-event.py --source-check 'Frontend Test & Build'

      - name: Setup Go
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test immutable release CI gate
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: node --test ../scripts/verify-release-ci.test.mjs

      - name: Test CI event classification
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: python3 ../scripts/classify-ci-event.test.py

      - name: Install dependencies
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: env -u NODE_ENV npm ci

      - name: Verify lint dependency patches
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: npm run check:dependency-patches

      - name: Check npm vulnerabilities
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: env -u NODE_ENV npm audit --audit-level=moderate

      - name: Run frontend check
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: env -u NODE_ENV npm run check

      - name: Install Playwright browsers
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: env -u NODE_ENV npx playwright install --with-deps chromium firefox webkit

      - name: Run backup-asset Playwright matrix
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: env -u NODE_ENV npm run e2e:evidence -- --config=playwright.config.ts --output=.tmp/agent/e2e-default
      - name: Prepare real-backend smoke build cache
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        working-directory: backend
        run: go build -o /dev/null ./cmd/server

      - name: Install isolated OpenSSH and sqlite3
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: sudo apt-get update && sudo apt-get install -y openssh-server sqlite3

      - name: Run real-backend Playwright lifecycle
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: env -u NODE_ENV npm run e2e:evidence -- --config=playwright.real-backend.config.ts --output=.tmp/agent/e2e-real-backend

      - name: Upload browser execution evidence
        if: ${{ always() && (needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-execution-evidence
          path: |
            .tmp/agent/e2e-default
            .tmp/agent/e2e-real-backend
          include-hidden-files: true
          if-no-files-found: error

      - name: Check frontend bundle budget
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        # Requires dist/ produced by 'npm run check' (which includes build)
        run: env -u NODE_ENV node scripts/check-bundle-budget.mjs

      - name: Check frontend coverage
        if: ${{ always() && (needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata') }}
        # Enforce report generation; no percentage threshold exists in the repository source of truth.
        run: |
          if [ ! -s coverage/lcov.info ]; then
            echo "::error::Frontend coverage report not found"
            exit 1
          fi
          LINES=$(grep -c "^SF:" coverage/lcov.info || echo 0)
          COVERED=$(grep -c "^DA:" coverage/lcov.info || echo 0)
          echo "Frontend source files: ${LINES}"
          echo "Frontend covered lines entries: ${COVERED}"

  account-recovery:
    name: ${{ needs.classify.result == 'success' && needs.classify.outputs.mode == 'metadata' && 'Metadata only / Account Recovery Browser Acceptance' || 'Account Recovery Browser Acceptance' }}
    needs: [classify]
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: env -u NODE_ENV npm ci

      - name: Verify lint dependency patches
        run: npm run check:dependency-patches

      - name: Verify Python fixture prerequisite
        run: python3 --version

      - name: Install Chromium
        run: env -u NODE_ENV npx playwright install --with-deps chromium

      - name: Run safe account recovery acceptance
        run: env -u NODE_ENV -u DEBUG -u PWDEBUG npm run e2e:evidence -- --config=playwright.account-recovery.config.ts --project=chromium --output=.tmp/agent/e2e-account-recovery

      - name: Upload safe account recovery counts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: account-recovery-execution-evidence
          path: .tmp/agent/e2e-account-recovery
          include-hidden-files: true
          if-no-files-found: error

  walkthrough:
    name: ${{ needs.classify.result == 'success' && needs.classify.outputs.mode == 'metadata' && 'Metadata only / Complete Browser Walkthrough' || 'Complete Browser Walkthrough' }}
    needs: [classify]
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: env -u NODE_ENV npm ci

      - name: Verify lint dependency patches
        run: npm run check:dependency-patches

      - name: Install Chromium
        run: env -u NODE_ENV npx playwright install --with-deps chromium

      - name: Execute all walkthrough scenarios
        run: env -u NODE_ENV npm run walkthrough -- --output .tmp/agent/walkthrough-ci

      - name: Compile walkthrough evidence
        if: always()
        working-directory: .
        run: node web/scripts/compile-walkthrough-evidence.mjs --run .tmp/agent/walkthrough-ci

      - name: Execute Docker and history state scenarios
        if: always()
        run: env -u NODE_ENV npm run e2e:evidence -- --config=playwright.surface-states.config.ts --output=.tmp/agent/e2e-surface-states

      - name: Compile Docker and history state evidence
        if: always()
        working-directory: .
        run: node web/scripts/compile-walkthrough-evidence.mjs --surface-run .tmp/agent/e2e-surface-states

      - name: Upload walkthrough and state evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walkthrough-execution-evidence
          path: |
            .tmp/agent/walkthrough-ci
            .tmp/agent/e2e-surface-states
          include-hidden-files: true
          if-no-files-found: error

  docker-build:
    name: ${{ needs.classify.result == 'success' && needs.classify.outputs.mode == 'metadata' && 'Metadata only / Docker Build' || 'Docker Build' }} (${{ matrix.arch }})
    needs: [classify]
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Test preserved build input policy
        run: python3 scripts/test-build-inputs.py

      - name: Verify preserved build input contract
        run: python3 scripts/build-inputs.py verify --lock deploy/build-inputs/lock.json

      - name: Check asset-content Nginx policy
        run: bash scripts/check-asset-content-nginx.sh

      - name: Self-test asset-content Nginx checker
        run: bash scripts/check-asset-content-nginx.test.sh

      - name: Run asset-content Nginx live gateway probe
        run: bash scripts/check-asset-content-nginx-runtime.sh

      - name: Check Compose configuration
        run: bash scripts/check-compose-config.sh

      - name: Self-test database backup and restore scripts
        run: bash scripts/backup-restore.test.sh

      - name: Self-test predeploy backup state handling
        run: bash scripts/predeploy-backup.test.sh

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/allinone/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          provenance: false
          tags: linnea7171/xirang:ci-core-smoke-${{ matrix.arch }}

      - name: Inspect local Core image
        env:
          CORE_IMAGE_REF: linnea7171/xirang:ci-core-smoke-${{ matrix.arch }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          BUILD_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          test -n "${BUILD_IMAGE_ID}"
          actual_os="$(docker image inspect --format '{{.Os}}' "${CORE_IMAGE_REF}")"
          actual_arch="$(docker image inspect --format '{{.Architecture}}' "${CORE_IMAGE_REF}")"
          actual_image_id="$(docker image inspect --format '{{.Id}}' "${CORE_IMAGE_REF}")"
          if [[ "${actual_os}" != "linux" ]]; then
            echo "::error::Core image OS ${actual_os} is not linux"
            exit 1
          fi
          if [[ "${actual_arch}" != "${EXPECTED_ARCH}" ]]; then
            echo "::error::Core image architecture ${actual_arch} does not match ${EXPECTED_ARCH}"
            exit 1
          fi
          if [[ "${actual_image_id}" != "${BUILD_IMAGE_ID}" ]]; then
            echo "::error::Core image ID ${actual_image_id} does not match Buildx output ${BUILD_IMAGE_ID}"
            exit 1
          fi
          printf 'Verified Core image: os=%s arch=%s imageid=%s\n' \
            "${actual_os}" "${actual_arch}" "${actual_image_id}"

      - name: Scan local Core image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Self-test core-only Compose smoke
        run: bash scripts/test-core-compose.test.sh

      - name: Run core-only Compose smoke
        env:
          CORE_COMPOSE_IMAGE_TAG: ci-core-smoke-${{ matrix.arch }}
          CORE_COMPOSE_PROJECT: xirang-core-smoke-${{ matrix.arch }}
        run: bash scripts/test-core-compose.sh

  asset-worker-closure:
    # asset-worker-closure-no-publish: native builders export exact closure evidence only.
    name: ${{ needs.classify.result == 'success' && needs.classify.outputs.mode == 'metadata' && 'Metadata only / Asset Worker Runtime Closure' || 'Asset Worker Runtime Closure' }} (${{ matrix.arch }})
    needs: [classify]
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Verify preserved build input contract
        run: python3 scripts/build-inputs.py verify --lock deploy/build-inputs/lock.json

      - name: Build native Worker closure image
        env:
          ASSET_WORKER_IMAGE: xirang-asset-worker:closure-${{ matrix.arch }}
        run: |
          docker build --platform "linux/${{ matrix.arch }}" \
            -t "$ASSET_WORKER_IMAGE" \
            -f deploy/worker/Dockerfile .

      - name: Extract and validate native runtime closure
        env:
          ASSET_WORKER_IMAGE: xirang-asset-worker:closure-${{ matrix.arch }}
          EXPECTED_WORKER_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          closure_dir="${RUNNER_TEMP}/asset-worker-runtime-closure-${{ matrix.arch }}"
          closure_path="$closure_dir/runtime-closure.v1.json"
          mkdir -p "$closure_dir"
          container_id=$(docker create "$ASSET_WORKER_IMAGE")
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/usr/local/share/xirang/runtime-closure.v1.json" "$closure_path"
          ASSET_WORKER_VALIDATE_RUNTIME_CLOSURE="$closure_path" bash scripts/test-asset-worker.sh
          docker rm -f "$container_id" >/dev/null
          trap - EXIT

      - name: Upload native runtime closure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-worker-runtime-closure-${{ matrix.arch }}
          path: ${{ runner.temp }}/asset-worker-runtime-closure-${{ matrix.arch }}/runtime-closure.v1.json
          if-no-files-found: error
          retention-days: 1

  asset-worker:
    # asset-worker-no-publish: this job builds, scans and smokes local images only.
    name: ${{ needs.classify.result == 'success' && needs.classify.outputs.mode == 'metadata' && 'Metadata only / Asset Worker Build & Scan' || 'Asset Worker Build & Scan' }} (${{ matrix.arch }})
    needs: [classify, asset-worker-closure]
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata') && needs.asset-worker-closure.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download amd64 runtime closure
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-worker-runtime-closure-amd64
          path: ${{ runner.temp }}/asset-worker-runtime-closure-amd64

      - name: Download arm64 runtime closure
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asset-worker-runtime-closure-arm64
          path: ${{ runner.temp }}/asset-worker-runtime-closure-arm64

      - name: Run malicious fixture and sandbox unit tests
        working-directory: backend
        run: go test ./internal/backupasset/processing/capabilities -count=1

      - name: Check Compose contracts
        run: |
          bash scripts/check-compose-config.sh
          bash scripts/check-compose-config.test.sh

      - name: Self-test core and Worker smoke scripts
        run: |
          bash scripts/test-core-compose.test.sh
          bash scripts/test-asset-worker.test.sh

      - name: Build local Worker image
        run: |
          docker build --platform "linux/${{ matrix.arch }}" \
            -t "xirang-asset-worker:ci-${{ matrix.arch }}" \
            -f deploy/worker/Dockerfile .

      - name: Inspect and smoke native Worker image
        env:
          ASSET_WORKER_IMAGE: xirang-asset-worker:ci-${{ matrix.arch }}
          EXPECTED_WORKER_ARCH: ${{ matrix.arch }}
          ASSET_WORKER_AMD64_RUNTIME_CLOSURE: ${{ runner.temp }}/asset-worker-runtime-closure-amd64/runtime-closure.v1.json
          ASSET_WORKER_ARM64_RUNTIME_CLOSURE: ${{ runner.temp }}/asset-worker-runtime-closure-arm64/runtime-closure.v1.json
        run: bash scripts/test-asset-worker.sh

      - name: Build local Core image for Worker profile smoke
        if: matrix.arch == 'amd64'
        run: docker build --platform linux/amd64 -t linnea7171/xirang:ci-asset-worker-profile -f deploy/allinone/Dockerfile .

      - name: Run complete Worker Compose profile smoke
        if: matrix.arch == 'amd64'
        env:
          ASSET_WORKER_IMAGE: xirang-asset-worker:ci-${{ matrix.arch }}
          EXPECTED_WORKER_ARCH: ${{ matrix.arch }}
          ASSET_WORKER_PROFILE_SMOKE: "1"
          ASSET_WORKER_CORE_IMAGE_TAG: ci-asset-worker-profile
          ASSET_WORKER_PROFILE_PROJECT: xirang-asset-worker-profile-ci
          ASSET_WORKER_AMD64_RUNTIME_CLOSURE: ${{ runner.temp }}/asset-worker-runtime-closure-amd64/runtime-closure.v1.json
          ASSET_WORKER_ARM64_RUNTIME_CLOSURE: ${{ runner.temp }}/asset-worker-runtime-closure-arm64/runtime-closure.v1.json
          ASSET_WORKER_PROFILE_EVIDENCE_DIR: ${{ runner.temp }}/asset-worker-profile-signing-evidence
        run: bash scripts/test-asset-worker.sh

      - name: Upload Worker profile signing evidence
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-worker-profile-signing-evidence-amd64
          path: ${{ runner.temp }}/asset-worker-profile-signing-evidence
          if-no-files-found: error
          retention-days: 1

      - name: Scan local Worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: xirang-asset-worker:ci-${{ matrix.arch }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  doc-freshness:
    name: Doc Freshness Check
    needs: [classify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout metadata verifier
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.mode == 'metadata' }}
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/classify-ci-event.py
      - name: Verify source check
        if: ${{ needs.classify.result == 'success' && needs.classify.outputs.mode == 'metadata' }}
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_METADATA_RECORD: ${{ needs.classify.outputs.record }}
        run: python3 scripts/classify-ci-event.py --source-check 'Doc Freshness Check'

      - name: Check doc freshness
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: bash scripts/check-doc-freshness.sh

      - name: Self-test doc freshness script
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: bash scripts/check-doc-freshness.test.sh

      - name: Check migration documentation version
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: bash scripts/check-migration-version.sh

      - name: Self-test migration documentation checker
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: bash scripts/check-migration-version.test.sh

      - name: Self-test documentation structure checker
        if: ${{ needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata' }}
        run: python3 scripts/check-doc-structure.test.py

  migration-utc-safety:
    name: ${{ needs.classify.result == 'success' && needs.classify.outputs.mode == 'metadata' && 'Metadata only / Migration UTC Safety' || 'Migration UTC Safety' }}
    needs: [classify]
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.mode != 'metadata') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Lint migrations for UTC regression patterns
        run: bash scripts/check-migration-utc-safety.sh

      - name: Self-test the lint script
        run: bash scripts/check-migration-utc-safety.test.sh
