name: Publish Docker Images

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "维护者手动重发时使用的镜像版本号（例如 0.2.0 或 v0.2.0）"
        required: true
        type: string
      source_ref:
        description: "维护者手动重发时使用的源码 ref（tag/branch/SHA）"
        required: true
        type: string

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  build:
    name: Build & Scan (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            platform_key: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform_key: linux-arm64
            runner: ubuntu-24.04-arm
    env:
      REGISTRY_IMAGE: docker.io/linnea7171/xirang

    steps:
      - name: Reject prerelease releases
        if: github.event_name == 'release' && github.event.release.prerelease
        run: |
          echo "pre-release publishing is not supported in this repository" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.source_ref }}

      - name: Resolve source commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            raw_tag="${{ github.event.release.tag_name }}"
          else
            raw_tag="${{ github.event.inputs.version }}"
          fi

          clean_tag="${raw_tag#refs/tags/}"
          clean_version="${clean_tag#v}"

          if [[ -z "${clean_version}" ]]; then
            echo "version is empty" >&2
            exit 1
          fi

          if ! echo "${clean_version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid semver: ${clean_version}" >&2
            exit 1
          fi

          echo "version=${clean_version}" >> "${GITHUB_OUTPUT}"

      - name: DockerHub login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # 每个平台在原生 runner 上分别构建并只按 digest 推送，避免在 x64 runner
      # 上用 QEMU 跑 arm64 的 Node/CGO 构建。扫描通过前不会创建正式 tag。
      - name: Build image by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: deploy/allinone/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=xirang-${{ matrix.platform_key }}
          cache-to: type=gha,scope=xirang-${{ matrix.platform_key }},mode=max

      # Trivy 扫描平台 digest；HIGH/CRITICAL 漏洞会阻断 manifest/tag 发布。
      # 注：trivy-action 钉到 v0.36.0 tag 的解引用 commit，避免浮动 ref 供应链攻击窗口。
      # v0.36.0 已通过 `git ls-remote` 在 2026-05-06 核验为 ed142fd...。
      # 升级时维护者请重新核对最新 release 并参考 https://github.com/aquasecurity/trivy-action/releases
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }}
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.platform_key }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build
    env:
      REGISTRY_IMAGE: docker.io/linnea7171/xirang

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.source_ref }}

      - name: Resolve source commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            raw_tag="${{ github.event.release.tag_name }}"
          else
            raw_tag="${{ github.event.inputs.version }}"
          fi

          clean_tag="${raw_tag#refs/tags/}"
          clean_version="${clean_tag#v}"

          if [[ -z "${clean_version}" ]]; then
            echo "version is empty" >&2
            exit 1
          fi

          if ! echo "${clean_version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid semver: ${clean_version}" >&2
            exit 1
          fi

          echo "version=${clean_version}" >> "${GITHUB_OUTPUT}"

      - name: DockerHub login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create and push manifest
        id: manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail

          tag_args=()
          first_tag=""
          while IFS= read -r tag; do
            if [[ -z "${tag}" ]]; then
              continue
            fi
            tag_args+=(--tag "${tag}")
            if [[ -z "${first_tag}" ]]; then
              first_tag="${tag}"
            fi
          done <<< "${TAGS}"

          if [[ "${#tag_args[@]}" -eq 0 ]]; then
            echo "no image tags resolved" >&2
            exit 1
          fi

          sources=()
          while IFS= read -r digest_file; do
            digest="$(basename "${digest_file}")"
            sources+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f | sort)

          if [[ "${#sources[@]}" -eq 0 ]]; then
            echo "no platform digests downloaded" >&2
            exit 1
          fi

          if [[ "${#sources[@]}" -lt 2 ]]; then
            echo "expected at least 2 platform digests, got ${#sources[@]}" >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${first_tag}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

          {
            echo "platform_sources<<EOF"
            printf '%s\n' "${sources[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "platform_sources_summary<<EOF"
            printf -- '- %s\n' "${sources[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Build summary
        run: |
          {
            echo "### Image Published: xirang"
            echo ""
            echo "- Version: ${{ steps.version.outputs.version }}"
            echo "- Source ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.source_ref }}"
            echo "- Source commit: ${{ steps.source.outputs.commit }}"
            echo "- Digest: ${{ steps.manifest.outputs.digest }}"
            echo "- Latest updated: ${{ github.event_name == 'release' && 'yes' || 'no (manual rebuild)' }}"
            echo "- Tags:"
            echo "\`${{ steps.meta.outputs.tags }}\`"
            echo "- Platform digests:"
            echo "${{ steps.manifest.outputs.platform_sources_summary }}"
          } >> "${GITHUB_STEP_SUMMARY}"
